<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>インターネッタークロニクル</title>
<meta name="description" content="ネットの出来事を時系列で並べるゲーム。サービスの開始・終了、企業の買収、ネットの流行など200件以上から出題。">
<!-- OGP(SNSで共有したときのカード表示) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="インターネッタークロニクル">
<meta property="og:title" content="インターネッタークロニクル">
<meta property="og:description" content="ネットの出来事を時系列に並べよう">
<meta property="og:url" content="https://youkoseki.github.io/internetter_chronicle/">
<meta property="og:image" content="https://youkoseki.github.io/internetter_chronicle/ogp.png">

<meta property="og:image:alt" content="インターネッタークロニクル: ネットの出来事を時系列に並べるゲーム">
<meta property="og:locale" content="ja_JP">

<style>
  :root {
    --bg: #ffffff;
    --panel: #f3f4f8;
    --card: #eef1f7;
    --text: #222633;
    --sub: #6b7285;
    --accent: #ffc928;
    --accent-text: #b36b00;   /* 白背景で読める濃いめの黄土色 */
    --ok: #2fbf71;
    --ng: #e5484d;
    --ng-bg: #fdecec;
    --line: #c5cad8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------- 共通ボタン ---------- */
  button {
    font: inherit; color: inherit; border: 0; cursor: pointer;
    touch-action: manipulation;
  }
  .btn {
    background: var(--accent); color: #222; font-weight: 700;
    padding: 14px 32px; border-radius: 999px; font-size: 18px;
  }
  /* 目立たせない副ボタン(モードを変更する) */
  .btn-sub {
    background: transparent; color: var(--accent-text); font-weight: 700;
    padding: 10px 24px; border-radius: 999px; font-size: 15px; border: 2px solid var(--accent);
  }

  /* ---------- タイトル / 結果画面 ---------- */
  .screen {
    flex: 1 0 auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 24px 16px; text-align: center;
  }
  .screen h1 { font-size: 40px; margin: 0; color: var(--accent-text); letter-spacing: .05em; }
  .screen h1.app-title {
    font-size: clamp(24px, 8.5vw, 40px); letter-spacing: 0; line-height: 1.3;
    /* 日本語は文字の途中で折り返さず、<wbr> の位置でだけ折り返す(Safariで<wbr>を効かせるために必要)。
       それでも収まらない場合に限り、どこでも折り返せるようにする */
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  /* 効果音のトグルスイッチ */
  .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; color: var(--text); user-select: none; max-width: 100%; text-align: left; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }   /* 見た目は .track で作る(キーボード操作は維持) */
  .toggle .track { position: relative; flex: none; width: 44px; height: 26px; border-radius: 999px; background: #c5cad8; transition: background .2s; }
  .toggle .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .2s; }
  .toggle input:checked + .track { background: var(--accent); }
  .toggle input:checked + .track .knob { transform: translateX(18px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent-text); outline-offset: 2px; }

  /* 結果画面の共有ボタン */
  .share { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn-share {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px;
    color: #fff; font-weight: 700; font-size: 15px; text-decoration: none;
  }
  .btn-share svg { width: 16px; height: 16px; fill: currentColor; }
  .btn-share.x { background: #14171a; }
  .btn-share.bsky { background: #1185fe; }

  .screen p { margin: 0; color: var(--sub); line-height: 1.7; }
  .result-row { font-size: 20px; }
  .result-row b { color: var(--accent-text); font-size: 28px; }
  .score { font-size: 14px; color: var(--sub); }
  #errorMsg { color: var(--ng); }

  /* ---------- ゲーム画面 ---------- */
  #game { display: flex; flex-direction: column; flex: 1 0 auto; }

  /* 上部の固定バー: 時間・ミス・進捗 */
  .hud {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top));
    display: flex; justify-content: space-between; font-variant-numeric: tabular-nums;
    font-size: 15px; box-shadow: 0 1px 6px #0002;
  }
  .hud b { color: var(--accent-text); }

  /* 今回置くミーム(日付は伏せる) */
  .current {
    position: sticky; top: calc(38px + env(safe-area-inset-top)); z-index: 9;
    margin: 0; padding: 12px 16px; background: var(--bg);
  }
  .current .card {
    background: var(--accent); color: #222; font-weight: 700; font-size: 20px;
    border-radius: 14px; padding: 16px; text-align: center;
    box-shadow: 0 3px 10px #0003;
  }
  .current .hint { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--sub); text-align: center; }
  /* 判定演出 */
  .current .card.ok { background: var(--ok); }
  .current .card.ng { background: var(--ng); color: #fff; }
  .current .reveal.ng { color: var(--ng); font-weight: 700; }
  .current .reveal { margin-top: 6px; text-align: center; font-size: 14px; min-height: 20px; }

  /* 並べ済みのタイムライン */
  .timeline { padding: 4px 16px 40px; display: flex; flex-direction: column; }
  .slot {
    height: 36px; margin: 2px 0; border-radius: 10px;
    border: 2px dashed var(--line); background: transparent; color: var(--sub);
    font-size: 13px; width: 100%;
  }
  .slot:active { background: #ffc92833; border-color: var(--accent); color: var(--accent-text); }
  .slot:disabled { opacity: .35; }
  /* 「古い」「新しい」ラベル */
  .axis { text-align: center; font-size: 12px; font-weight: 700; color: var(--sub); padding: 2px 0; }
  /* 並べ済みカード: 日付・タイトル・出典リンクを1行に収める */
  .placed {
    background: var(--card); border-radius: 10px; padding: 9px 12px;
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .placed .date { color: var(--accent-text); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .placed .title { font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ノーマル: 年だけ強調し、月日は細く薄くする */
  .y { font-weight: 700; }
  .md { font-weight: 400; opacity: .55; }
  .placed a { color: var(--sub); font-size: 12px; text-decoration: none; white-space: nowrap; }
  .placed.new { animation: pop .5s ease; }
  /* 直前に置いたカード: 次に置くまで濃い色のままにして、どこに入ったか分かるようにする */
  .placed.latest { background: #c9d4ee; }
  @keyframes pop {
    0% { background: var(--ok); transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  /* 不正解時に「本来ここに入る」ことを示すゴースト */
  .placed.ghost { background: #2fbf7122; border: 2px dashed var(--ok); animation: blink .4s ease 2; }
  @keyframes blink { 50% { background: #2fbf7166; } }

  /* 結果一覧 */
  #result.screen { justify-content: flex-start; padding-top: calc(24px + env(safe-area-inset-top)); padding-bottom: 40px; }
  .results { width: 100%; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  /* 結果一覧では文字を切らない(ゲーム中は1行表示のまま) */
  .results .placed { align-items: flex-start; }
  .results .placed .title { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
  .results .placed .date, .results .placed .mark { flex: none; }
  .results .placed.miss { background: var(--ng-bg); border-left: 4px solid var(--ng); }
  .results .placed.miss .date { color: var(--ng); }
  .results .placed.miss .title { color: var(--ng); }
  .results .placed.hit { border-left: 4px solid var(--ok); }
  .results .mark { font-weight: 700; }
  .legend { font-size: 12px; color: var(--sub); }

  /* ---------- タイムラインモード ---------- */
  #tlGame { display: flex; flex-direction: column; flex: 1 0 auto; }
  .hud .btn-done {
    border: 0; border-radius: 999px; padding: 4px 22px; background: var(--accent); color: #222;
    font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .tl-hint { margin: 0; padding: 12px 16px 0; font-size: 12px; line-height: 1.5; color: var(--sub); text-align: center; }
  /* 並べ替え中のカード: 日付は伏せ、タイトルは折り返して全文を見せる。
     カード上は touch-action: none でドラッグ専用にする。ページのスクロールは、
     左右の余白とカード間の隙間(下の #tlList)に指を置いて行う */
  #tlList { gap: 12px; padding: 4px 36px 40px; }
  .placed.tlcard { cursor: grab; padding: 14px 12px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .placed.tlcard .title { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; font-size: 15px; }
  .tlcard.dragging { position: relative; z-index: 20; cursor: grabbing; box-shadow: 0 6px 18px #0004; background: var(--accent); }
  /* 落とす位置の目印(影なのでレイアウトは動かない) */
  .tlcard.drop-before { box-shadow: 0 -4px 0 0 var(--accent-text); }
  .tlcard.drop-after { box-shadow: 0 4px 0 0 var(--accent-text); }
  /* ずれたカードの減点(薄く) */
  .results .placed .minus { flex: none; font-size: 12px; color: var(--ng); opacity: .6; white-space: nowrap; }
  .legend-inline { font-size: 12px; font-weight: 400; color: var(--sub); }
  /* 結果一覧の見出し */
  .list-title { margin-top: 10px; text-align: center; font-size: 15px; font-weight: 700; }

  /* ---------- フッター ---------- */
  .site-footer {
    flex: none; display: flex; justify-content: center; align-items: center; gap: 14px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid #e3e6ef; background: var(--panel);
    font-size: 13px; color: var(--sub);
  }
  .site-footer a { color: inherit; text-decoration: none; }
  .site-footer a:hover, .site-footer a:active { color: var(--accent-text); }
  .site-footer .bsky { display: inline-flex; padding: 4px; }   /* アイコンのタップ領域を広げる */
  .site-footer svg { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>

<!-- ===== タイトル画面 ===== -->
<section id="title" class="screen">
  <h1 class="app-title">インターネッター<wbr>クロニクル</h1>
  <p>ネットの出来事を、正しい順番で並べよう</p>
  <p id="errorMsg" class="hidden"></p>
  <!-- 並び順: ゲーム種類 → 難易度 → 効果音。ラベルの文言は状態に応じてJSで切り替える -->
  <!-- オフ=クイズ(1つずつ置いていく) / オン=タイムライン(10個をまとめて並べ替える) -->

    <input type="checkbox" id="typeToggle">

    <span id="typeText"></span>

  <!-- オフ=ノーマル(年だけで判定) / オン=ハード(年月日で判定) -->
  <label class="toggle">
    <input type="checkbox" id="hardToggle">
    <span class="track"><span class="knob"></span></span>

  </label>
  <label class="toggle">

  <div class="hud">

    <span>✔ <b id="progress">0</b>/<span id="goal">10</span></span>
    <span>✖ <b id="misses">0</b></span>

  <div class="current">
    <div id="currentCard" class="card"></div>
    <div id="reveal" class="reveal"></div>
    <div id="hint" class="hint"></div>

</main>

<!-- ===== ゲーム画面(タイムラインモード) ===== -->
<main id="tlGame" class="hidden">

    <span>⏱ <b id="tlTimer">0</b>s</span>

  <h1 id="rTitle">クリア!</h1>
  <div class="result-row">タイム <b id="rTime"></b> 秒</div>
  <div class="result-row"><span id="rLabel2">ミス</span> <b id="rMiss"></b> <span id="rUnit2">回</span></div>
  <div class="result-row" id="rMode"></div>
  <div class="score" id="rBest"></div>
  <button id="retryBtn" class="btn">同じモードで遊ぶ</button>
  <button id="menuBtn" class="btn-sub">モードを変更する</button>
  <!-- クリアしたときだけ表示。リンクは finishGame で組み立てる -->
  <div id="share" class="share hidden">
    <a id="shareX" class="btn-share x" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>Xに投稿</a>
    <a id="shareBsky" class="btn-share bsky" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bsky"/></svg>Blueskyに投稿</a>

  <div class="legend" id="legendQuiz">日付順の一覧(<span style="color:var(--ok)">緑＝正解</span> / <span style="color:var(--ng)">赤＝ミスで破棄</span>)</div>

  <a class="bsky" href="https://bsky.app/profile/youkoseki.com" target="_blank" rel="noopener" aria-label="Bluesky">

<script>
(() => {
  'use strict';

  // ================= 設定 =================
  const TSV_PATH = 'events.tsv';   // 出来事リスト。行を足せば自動で反映される
  const GOAL = 10;               // 何個並べたらクリアか
  const FEEDBACK_MS = 1600;      // 不正解時に正しい日付を見せる時間
  const OK_MS = 500;             // 正解時の演出時間
  const BEST_KEY = 'internetter-chronicle.best';
  const SOUND_KEY = 'internetter-chronicle.sound';
  const MODE_KEY = 'internetter-chronicle.mode';   // 'normal' / 'hard'
  const TYPE_KEY = 'internetter-chronicle.type';   // 'quiz' / 'timeline'
  // ゲーム種類×難易度ごとのベスト記録の保存先(クイズのハードは従来のキーをそのまま使う)
  const BEST_KEYS = {
    quiz: { normal: BEST_KEY + '.normal', hard: BEST_KEY },
    timeline: { normal: BEST_KEY + '.timeline.normal', hard: BEST_KEY + '.timeline.hard' },
  };
  const TYPE_NAMES = { quiz: 'クイズ', timeline: 'タイムライン' };
  // トグルのラベル(状態ごとの説明つき)
  const TYPE_NOTES = {
    quiz: 'クイズモード：順番に表示される出来事を正しい位置に置いていきます',
    timeline: 'タイムラインモード：10個の出来事を正しい時系列に並べ替えます',
  };
  const MODE_NAMES = { normal: 'ノーマル', hard: 'ハード' };
  const MODE_NOTES = {
    normal: 'ノーマルモード：年だけで正誤判定します',
    hard: 'ハードモード：年月日で正誤判定します',
  };
  // 結果や投稿文に出す「どのモードで遊んだか」(例: クイズ・ノーマルモード)
  const modeLabel = (type, m) => TYPE_NAMES[type] + '・' + MODE_NAMES[m] + 'モード';
  // 共有するゲームのURL。空なら今開いているページのURLを使う(公開後に固定したいときだけ設定)
  const SHARE_URL = '';

  // ================= 状態 =================
  let allMemes = [];   // tsvから読み込んだ全ミーム
  let deck = [];       // 出題待ちの山札(シャッフル済み)
  let placed = [];     // 正しく並べ済みのミーム(日付昇順)
  let current = null;  // いま置こうとしているミーム
  let misses = 0;
  let goal = GOAL;
  let startTime = 0;
  let timerId = null;
  let locked = false;  // 判定演出中は入力を受け付けない
  let latest = null;   // 直前に正しく置いたミーム(濃く表示する)
  let history = [];    // 結果一覧用: 出題したミームと正誤 {meme, ok}
  let mode = 'normal';     // タイトル画面で選択中の難易度
  let playMode = 'normal'; // いまプレイ中の難易度(開始時に固定する)
  let gameType = 'quiz';   // タイトル画面で選択中のゲーム種類 'quiz' / 'timeline'
  let playType = 'quiz';   // いまプレイ中のゲーム種類(開始時に固定する)
  let tlItems = [];        // タイムラインモード: いまの並び順

  const $ = id => document.getElementById(id);

  // ================= TSV読み込み =================
  // 1行目はヘッダ。列: できごと / 日(YYYYMMDD) / ソース / 年 / メモ
  // 列順が変わっても動くよう、ヘッダ名で列を引く。
  function parseTsv(text) {
    const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
    const header = lines.shift().split('\t');
    const col = name => header.indexOf(name);
    const iTitle = col('できごと'), iDate = col('日'), iSrc = col('ソース'), iOff = col('除外');

    const memes = [];
    for (const line of lines) {
      const cells = line.split('\t');
      const title = (cells[iTitle] || '').trim();
      const date = (cells[iDate] || '').trim();
      // 日付が8桁の数字になっていない行(未入力の行など)はスキップ
      if (!title || !/^\d{8}$/.test(date)) continue;
      // 「除外」列に 1 などが入っている行は使わない(行はデータとして残しておく)
      const off = iOff >= 0 ? (cells[iOff] || '').trim() : '';
      if (off && off !== '0') continue;
      memes.push({
        title,
        date: Number(date),            // 比較用の数値 (例: 19951123)
        dateStr: date,
        src: (cells[iSrc] || '').trim(),
      });
    }
    return memes;
  }

  // 20001018 → 「2000年10月18日」。月日が00の場合は省略表示する
  function formatDate(s) {
    const y = Number(s.slice(0, 4)), m = Number(s.slice(4, 6)), d = Number(s.slice(6, 8));
    return y + '年' + (m ? m + '月' : '') + (m && d ? d + '日' : '');
  }

  // 日付を el に表示する。ノーマルでは判定に使う「年」だけを強調し、月日は薄く細くする。
  // prefix は日付の前に付ける文字(「✖ 正解は 」など)
  function fillDate(el, s, prefix = '') {
    const full = formatDate(s);
    el.textContent = prefix;
    if (playMode !== 'normal') { el.append(full); return; }
    const i = full.indexOf('年') + 1;   // 「2000年」までが年の部分
    const y = document.createElement('span');
    y.className = 'y'; y.textContent = full.slice(0, i);
    const md = document.createElement('span');
    md.className = 'md'; md.textContent = full.slice(i);
    el.append(y, md);
  }

  // Fisher-Yates シャッフル
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ================= 効果音 =================
  // どれも小さな音量で短く鳴らす。音声ファイルは使わず、サイン波をその場で合成する。
  let audioCtx = null;
  let soundOn = true;   // タイトル画面のトグルで切り替え

  // AudioContext を用意する。ブラウザはユーザー操作の中でしか音を許可しないので、
  // スタートボタンのクリックから呼んで「解除」しておく。使えない環境では何もしない。
  function unlockAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* 音が鳴らないだけなので無視 */ }
  }

  // 1音を鳴らす。freq: 周波数(Hz) / at: 何秒後に鳴らすか / dur: 長さ(秒) / vol: 音量(0〜1)
  // 立ち上がりと減衰をなだらかにして、プツッというノイズが出ないようにする。
  function tone(freq, at, dur, vol, endFreq) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + at;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    // endFreq があれば、音程をなめらかに動かす(ミス音の下降など)
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);      // 立ち上がり
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);     // 減衰
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function playSound(kind) {
    if (!soundOn) return;
    try {
      if (kind === 'ok') {            // 正解: 軽く上がる2音
        tone(660, 0, 0.12, 0.05);
        tone(880, 0.07, 0.16, 0.05);
      } else if (kind === 'ng') {     // ミス: 低めの短い下降音
        tone(240, 0, 0.22, 0.06, 150);
      } else if (kind === 'clear') {  // クリア: ド・ミ・ソ・高いドの短い上昇音
        [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.22, 0.05));
      }
    } catch (e) { /* 音が鳴らないだけなので無視 */ }
  }

  // ================= ゲーム進行 =================
  function startGame() {
    unlockAudio();   // ボタン操作の中で呼ぶ必要がある
    playSound('ok'); // 開始の合図に、正解と同じ音を鳴らす
    // プレイ中に設定が変わらないよう、開始時のゲーム種類と難易度を固定する
    playMode = mode;
    playType = gameType;
    clearInterval(timerId);
    if (playType === 'timeline') startTimeline(); else startQuiz();
  }

  // クイズモード開始
  function startQuiz() {
    // 最初の1枚(基準)+ 並べる分が必要。ミームが少ないときはゴールを減らす
    goal = Math.min(GOAL, allMemes.length - 1);
    deck = shuffle(allMemes);
    placed = [deck.pop()];   // 最初に表示される基準ミーム(日付つき)
    misses = 0;
    latest = null;
    history = [{ meme: placed[0], ok: true }];   // 基準ミームは正解扱いで一覧に載せる
    locked = false;
    $('goal').textContent = goal;

    show('game');
    nextCard();
    render();

    // タイマー開始(最初のカードが表示された時点から)
    startTime = performance.now();
    clearInterval(timerId);
    timerId = setInterval(updateTimer, 250);
    updateTimer();
  }

  // 山札から次のミームを引く
  function nextCard() {
    current = deck.pop();
    const card = $('currentCard');
    card.textContent = current.title;
    card.className = 'card';
    $('reveal').textContent = '';
    $('reveal').className = 'reveal';
  }

  // 比較に使う値。ハードは年月日(YYYYMMDD)、ノーマルは年(YYYY)だけを見る
  function dateKey(m) {
    return playMode === 'normal' ? Math.floor(m.date / 10000) : m.date;
  }

  // スロット index に置けるか判定する。
  // 左隣 <= 正解 <= 右隣 であれば正解(比較値が同じミームは前後どちらでもOK。
  // ノーマルでは同じ年なら前後どちらでも正解になる)
  function isCorrect(index) {
    const left = placed[index - 1], right = placed[index];
    return (!left || dateKey(left) <= dateKey(current)) &&
           (!right || dateKey(current) <= dateKey(right));
  }

  function onSlot(index) {
    if (locked) return;
    locked = true;
    const card = $('currentCard');
    const ok = isCorrect(index);

    if (ok) {
      // 正解: 並べて次へ
      card.classList.add('ok');
      playSound('ok');
      fillDate($('reveal'), current.dateStr);
      history.push({ meme: current, ok: true });
      latest = current;
      placed.splice(index, 0, current);
      render(index);   // 追加したカードに演出をつける
      setTimeout(finishOrNext, OK_MS);
    } else {
      // 不正解: 並べずに破棄。正しい日付を見せて学習できるようにする
      misses++;
      history.push({ meme: current, ok: false });
      card.classList.add('ng');
      playSound('ng');
      $('reveal').className = 'reveal ng';
      fillDate($('reveal'), current.dateStr, '✖ 正解は ');
      // 本来入るはずだった位置(自分より新しいミームの手前)にゴーストを出す
      // (表示位置は難易度に関係なく、常に年月日で決める)
      const ghostAt = placed.filter(m => m.date <= current.date).length;
      render(-1, ghostAt);
      const g = document.querySelector('.ghost');
      if (g) g.scrollIntoView({ block: 'center', behavior: 'smooth' });
      setTimeout(finishOrNext, FEEDBACK_MS);
    }
  }

  // クリア判定 or 次のカードへ
  function finishOrNext() {
    const cleared = placed.length - 1 >= goal;   // 基準の1枚は数えない
    // 山札が尽きた場合もそこで終了(ミームが足りないとき)
    if (cleared || deck.length === 0) return finishGame();
    nextCard();
    locked = false;   // 先に解除してから描画する(スロットのdisabledに反映させるため)
    render();
  }

  // ---------- ベスト記録 ----------
  // 保存形式は クイズ {sec, misses} / タイムライン {sec, score}。
  // 壊れた値や旧形式の値(数値だけ)は「記録なし」として扱う。
  // ゲーム種類(type)と難易度(m)ごとに別々に記録する
  function loadBest(type, m) {
    try {
      const b = JSON.parse(localStorage.getItem(BEST_KEYS[type][m]));
      const field = type === 'timeline' ? 'score' : 'misses';
      if (b && Number.isFinite(b.sec) && Number.isFinite(b[field])) return b;
    } catch (e) {}
    return null;
  }
  // a が b より良い記録か
  //   クイズ: ミスが少ない方が上、同じならタイムが短い方が上
  //   タイムライン: スコアが高い方が上、同じならタイムが短い方が上
  function isBetter(a, b, type) {
    if (type === 'timeline') return a.score > b.score || (a.score === b.score && a.sec < b.sec);
    return a.misses < b.misses || (a.misses === b.misses && a.sec < b.sec);
  }
  function bestLabel(b, type) {
    // 記録がないとき(b が null)は「--」で表示する
    if (type === 'timeline') return 'ベストスコア: ' + (b ? b.score : '--') + '点 / ' + (b ? b.sec : '--') + '秒';
    return 'ベストスコア: ' + (b ? b.sec : '--') + '秒 / ミス' + (b ? b.misses : '--') + '回';
  }
  // 今回の結果 now をベストと比べ、必要なら保存して、表示する文言を返す。
  // cleared が false のとき(クイズのゲームオーバー)は記録の対象外
  function judgeBest(now, cleared) {
    const best = loadBest(playType, playMode);
    if (!cleared) return bestLabel(best, playType) + '(今回は記録されません)';
    if (!best || isBetter(now, best, playType)) {
      // localStorageが使えなくても落ちないように
      try { localStorage.setItem(BEST_KEYS[playType][playMode], JSON.stringify(now)); } catch (e) {}
      return '🎉 ベスト更新!';
    }
    return bestLabel(best, playType);
  }

  // X / Bluesky の投稿画面を開くリンクを作る。クリアしていないときはボタンごと隠す
  //   headline: 1行目(「…をクリア！」など) / stats: 2行目(タイム・ミス/スコア・モード)
  function setupShare(cleared, headline, stats) {
    $('share').classList.toggle('hidden', !cleared);
    if (!cleared) return;
    const url = SHARE_URL || (location.origin + location.pathname);
    // 投稿本文(\n は改行)
    const text = headline + '\n' + stats + '\n' +
      '#インターネッタークロニクル';
    // X は本文とURLを別パラメータで渡す。Bluesky は本文にURLを含める(自動でリンクカードになる)
    $('shareX').href = 'https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
    $('shareBsky').href = 'https://bsky.app/intent/compose?text=' + encodeURIComponent(text + '\n' + url);
  }

  function finishGame() {
    clearInterval(timerId);
    const sec = Math.floor((performance.now() - startTime) / 1000);   // 表示と同じ整数秒で扱う
    // 目標数を並べられたか(山札切れで終わった場合は false)
    const cleared = placed.length - 1 >= goal;
    $('rTitle').textContent = cleared ? 'クリア！' : 'ゲームオーバー';
    const label = modeLabel(playType, playMode);
    $('rMode').textContent = label;   // タイム・ミスの下にモードを表示
    if (cleared) playSound('clear');
    setupShare(cleared, 'インターネッタークロニクルをクリア！',
      'タイム ' + sec + '秒 / ミス ' + misses + '回 / ' + label);

    $('rTime').textContent = sec;
    $('rLabel2').textContent = 'ミス';
    $('rMiss').textContent = misses;
    $('rUnit2').textContent = '回';
    $('legendQuiz').classList.remove('hidden');

    // ベスト記録(目標数を並べられなかったときは記録の対象外)
    $('rBest').textContent = judgeBest({ sec, misses }, cleared);

    // 並べたもの・間違えたものを日付順に一覧表示(ミスは赤)
    const list = $('resultList');
    list.textContent = '';
    list.appendChild(axisLabel('▲ 古い'));
    const sorted = history.slice().sort((x, y) => x.meme.date - y.meme.date);   // 一覧は難易度に関わらず年月日順
    for (const h of sorted) {
      const el = placedCard(h.meme, false, false);
      el.classList.add(h.ok ? 'hit' : 'miss');
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = h.ok ? '✔' : '✖';
      el.prepend(mark);
      list.appendChild(el);
    }
    list.appendChild(axisLabel('▼ 新しい'));
    show('result');
  }

  // ================= タイムラインモード =================
  // items[i] が置かれた位置 i について、正しい位置の範囲 lo..hi と、そこからのずれ d を返す。
  // 比較値(dateKey)が同じカードは前後どちらでも正解なので、正しい位置は幅を持つ
  function tlRange(items, i) {
    const k = dateKey(items[i]);
    const lo = items.filter(m => dateKey(m) < k).length;
    const hi = items.filter(m => dateKey(m) <= k).length - 1;
    const d = i < lo ? lo - i : (i > hi ? i - hi : 0);
    return { lo, hi, d };
  }
  // 全カードのずれの合計
  function tlPenalty(items) {
    return items.reduce((sum, _, i) => sum + tlRange(items, i).d, 0);
  }
  // スコア: ずれの合計(1つずれるごとに1点)を、満点から引く。
  // 満点は「完全に逆順のときのずれの合計」= n*n/2(10枚なら50)。
  // つまり全問正解で満点(10枚なら50点)、完全に逆順で0点になる
  function tlScore(items) {
    const maxPenalty = Math.floor(items.length * items.length / 2);
    return Math.max(0, maxPenalty - tlPenalty(items));
  }

  function startTimeline() {
    const n = Math.min(GOAL, allMemes.length);
    const picked = shuffle(allMemes).slice(0, n);
    // 最初から正しい並びだと遊びにならないので、そうなったらシャッフルし直す(念のため回数に上限)
    tlItems = shuffle(picked);
    for (let t = 0; t < 20 && tlPenalty(tlItems) === 0; t++) tlItems = shuffle(picked);
    show('tlGame');
    renderTimeline();
    startTime = performance.now();
    timerId = setInterval(updateTimer, 250);
    updateTimer();
  }

  // 並べ替え画面を描く。カードはドラッグで動かす(movedTo: 直前に動かしたカードの位置)
  function renderTimeline(movedTo = -1) {
    const tl = $('tlList');
    tl.textContent = '';
    tl.appendChild(axisLabel('▲ 古い'));
    let movedEl = null;
    tlItems.forEach((m, i) => {
      const card = document.createElement('div');
      card.className = 'placed tlcard';
      const t = document.createElement('div');
      t.className = 'title'; t.textContent = m.title;
      card.appendChild(t);
      attachDrag(card, i);
      tl.appendChild(card);
      if (i === movedTo) movedEl = card;
    });
    tl.appendChild(axisLabel('▼ 新しい'));
    // 移したカードが画面外に行かないように見える位置へ寄せる
    if (movedEl) movedEl.scrollIntoView({ block: 'nearest' });
  }

  // from 番目のカードを、抜いたあとの並びの to 番目へ移す
  function moveCard(from, to) {
    const [m] = tlItems.splice(from, 1);
    tlItems.splice(to, 0, m);
    renderTimeline(to);
  }

  // ---------- ドラッグ&ドロップ ----------
  // Pointer Events でマウス・タッチ・ペンをまとめて扱う。
  // カード上は touch-action: none(CSS)でドラッグ専用にし、ページのスクロールは
  // カードの左右の余白・カード間の隙間から行う。
  // ドラッグ中は DOM を組み替えず、カードを transform で指に追従させ、
  // 落とす位置は「他のカードの中心より上にあるカードの数」で決める。
  function attachDrag(card, idx) {
    card.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      const startY = e.clientY, startScroll = window.scrollY;
      const others = [...$('tlList').querySelectorAll('.tlcard')].filter(c => c !== card);
      let lastY = startY, target = idx, raf = 0;
      card.setPointerCapture(e.pointerId);
      card.classList.add('dragging');

      // カードの追従と、落とす位置(target)の更新
      function update() {
        card.style.transform = 'translateY(' + (lastY - startY + window.scrollY - startScroll) + 'px)';
        target = others.filter(o => {
          const r = o.getBoundingClientRect();
          return r.top + r.height / 2 < lastY;
        }).length;
        others.forEach(o => o.classList.remove('drop-before', 'drop-after'));
        if (target < others.length) others[target].classList.add('drop-before');
        else others[others.length - 1].classList.add('drop-after');
      }
      // 画面の上端・下端に寄せたら、ページを自動スクロールする
      function tick() {
        const vh = window.innerHeight, top = 90, bottom = vh - 70;
        if (lastY < top) window.scrollBy(0, -Math.min(20, (top - lastY) / 3 + 2));
        else if (lastY > bottom) window.scrollBy(0, Math.min(20, (lastY - bottom) / 3 + 2));
        update();
        raf = requestAnimationFrame(tick);
      }
      function onMove(ev) { lastY = ev.clientY; }
      function onEnd(ev) {
        card.removeEventListener('pointermove', onMove);
        card.removeEventListener('pointerup', onEnd);
        card.removeEventListener('pointercancel', onEnd);
        cancelAnimationFrame(raf);
        if (ev.type === 'pointercancel' || target === idx) renderTimeline();   // 元の位置に戻す
        else moveCard(idx, target);
      }
      card.addEventListener('pointermove', onMove);
      card.addEventListener('pointerup', onEnd);
      card.addEventListener('pointercancel', onEnd);
      raf = requestAnimationFrame(tick);
    });
  }

  // 「完成」ボタン: 採点して結果画面へ
  function finishTimeline() {
    clearInterval(timerId);
    const sec = Math.floor((performance.now() - startTime) / 1000);
    const score = tlScore(tlItems);
    const label = modeLabel(playType, playMode);

    $('rTitle').textContent = '完成！';
    $('rMode').textContent = label;
    $('rTime').textContent = sec;
    $('rLabel2').textContent = 'スコア';
    $('rMiss').textContent = score;
    $('rUnit2').textContent = '点';
    $('legendQuiz').classList.add('hidden');   // タイムラインの凡例は一覧の見出しに含める
    playSound('clear');
    setupShare(true, 'インターネッタークロニクルを完成！',
      'タイム ' + sec + '秒 / スコア ' + score + '点 / ' + label);
    $('rBest').textContent = judgeBest({ sec, score }, true);

    // 自分の並べた順(正しい位置なら緑、ずれていれば赤)の下に、正しい順のタイムラインを並べて見せる
    const list = $('resultList');
    list.textContent = '';
    list.appendChild(listTitle('あなたのタイムライン', true));
    list.appendChild(axisLabel('▲ 古い'));
    tlItems.forEach((m, i) => {
      const el = placedCard(m, false, false);
      const ok = tlRange(tlItems, i).d === 0;
      el.classList.add(ok ? 'hit' : 'miss');
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = ok ? '✔' : '✖';
      el.prepend(mark);
      if (!ok) {
        // このカードのずれによる減点(薄く表示)。ずれ1つにつき1点
        const minus = document.createElement('span');
        minus.className = 'minus';
        minus.textContent = '−' + tlRange(tlItems, i).d + '点';
        const link = el.querySelector('a');
        if (link) el.insertBefore(minus, link); else el.appendChild(minus);
      }
      list.appendChild(el);
    });
    list.appendChild(axisLabel('▼ 新しい'));

    list.appendChild(listTitle('正しいタイムライン'));
    list.appendChild(axisLabel('▲ 古い'));
    for (const m of tlItems.slice().sort((x, y) => x.date - y.date)) {
      list.appendChild(placedCard(m, false, false));
    }
    list.appendChild(axisLabel('▼ 新しい'));
    show('result');
  }

  // ================= 描画 =================
  function updateTimer() {
    // 小数点以下は表示しない
    const s = Math.floor((performance.now() - startTime) / 1000);
    $('timer').textContent = s;
    $('tlTimer').textContent = s;
  }
  function updateHud() {
    $('progress').textContent = placed.length - 1;
    $('misses').textContent = misses;
  }

  // タイムラインを作り直す。
  //   newIndex: 直前に追加したカードの位置(正解演出用)
  //   ghostAt : 不正解時に「本来入るはずだった」スロットの位置(-1ならなし)
  function render(newIndex = -1, ghostAt = -1) {
    updateHint();
    const tl = $('timeline');
    tl.textContent = '';
    tl.appendChild(axisLabel('▲ 古い'));
    for (let i = 0; i <= placed.length; i++) {
      if (i === ghostAt) {
        // 本来の位置には、スロットの代わりに破棄されたミームを薄く表示する
        tl.appendChild(placedCard(current, false, true));
      } else {
        // 置き場所(カードとカードの間・先頭・末尾)
        const slot = document.createElement('button');
        slot.className = 'slot';
        slot.textContent = '＋ ここに置く';
        slot.disabled = locked;
        slot.addEventListener('click', () => onSlot(i));
        tl.appendChild(slot);
      }

      if (i < placed.length) {
        const card = placedCard(placed[i], i === newIndex);
        if (placed[i] === latest) card.classList.add('latest');
        tl.appendChild(card);
      }
    }
    tl.appendChild(axisLabel('▼ 新しい'));
    updateHud();
  }

  // 操作説明: 常に同じ文言を表示する
  function updateHint() {
    $('hint').textContent = 'どこに位置する出来事か考えよう。上ほど古く、下ほど新しい';
  }

  // 結果一覧の見出し(「あなたのタイムライン」など)
  // withLegend が true なら、同じ行に色の凡例(緑＝正しい位置 / 赤＝ずれ)を添える
  function listTitle(text, withLegend) {
    const el = document.createElement('div');
    el.className = 'list-title';
    el.textContent = text;
    if (withLegend) {
      const lg = document.createElement('span');
      lg.className = 'legend-inline';
      const ok = document.createElement('span'); ok.style.color = 'var(--ok)'; ok.textContent = '緑＝正しい位置';
      const ng = document.createElement('span'); ng.style.color = 'var(--ng)'; ng.textContent = 'ずれ(減点)';
      lg.append(ok, ' / ', ng);
      el.append(' ', lg);
    }
    return el;
  }

  function axisLabel(text) {
    const el = document.createElement('div');
    el.className = 'axis';
    el.textContent = text;
    return el;
  }

  // 日付・タイトル・出典リンクを1行にまとめたカード
  function placedCard(m, isNew, isGhost) {
    const el = document.createElement('div');
    el.className = 'placed' + (isNew ? ' new' : '') + (isGhost ? ' ghost' : '');
    const d = document.createElement('div');
    d.className = 'date'; fillDate(d, m.dateStr);
    const t = document.createElement('div');
    t.className = 'title'; t.textContent = m.title;
    el.append(d, t);
    // ソースURLがあればリンクを付ける(http(s)のみ許可)
    if (/^https?:\/\//.test(m.src)) {
      const a = document.createElement('a');
      a.href = m.src; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '出典 ↗';
      el.appendChild(a);
    }
    return el;
  }

  // 画面切り替え
  function show(name) {
    for (const id of ['title', 'game', 'tlGame', 'result']) $(id).classList.toggle('hidden', id !== name);
    window.scrollTo(0, 0);
  }

  // ================= 初期化 =================
  async function init() {
    updateModeView();

    try {
      const res = await fetch(TSV_PATH, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allMemes = parseTsv(await res.text());
      if (allMemes.length < 2) throw new Error('日付つきのミームが足りません');
      $('startBtn').disabled = false;
      $('startBtn').textContent = 'スタート';
    } catch (e) {
      // file:// で直接開くと fetch が失敗するので、その旨を表示
      $('startBtn').textContent = '読み込み失敗';
      const err = $('errorMsg');
      err.classList.remove('hidden');
      err.textContent = 'events.tsv を読み込めませんでした(' + e.message + ')。' +
        'ローカルではWebサーバー経由で開いてください。';
    }
  }

  // 効果音トグル: 前回の設定を復元し、変更したら保存する(localStorageが使えなくても動く)
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
  $('soundToggle').checked = soundOn;
  const updateSoundLabel = () => { $('soundText').textContent = soundOn ? '効果音あり' : '効果音なし'; };
  updateSoundLabel();
  $('soundToggle').addEventListener('change', e => {
    soundOn = e.target.checked;
    updateSoundLabel();
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (err) {}
    if (soundOn) { unlockAudio(); playSound('ok'); }   // オンにした瞬間に試し鳴りさせる
  });

  // タイトル画面の表示を、選択中のゲーム種類・難易度に合わせる(説明文と、そのモードのベスト記録)
  function updateModeView() {
    $('typeText').textContent = TYPE_NOTES[gameType];
    $('modeText').textContent = MODE_NOTES[mode];
    const best = loadBest(gameType, mode);
    $('bestText').textContent = bestLabel(best, gameType);   // 記録がなければ「--」表示
  }

  // ゲーム種類トグル: 前回の設定を復元し、変更したら保存して表示を切り替える
  try { gameType = localStorage.getItem(TYPE_KEY) === 'timeline' ? 'timeline' : 'quiz'; } catch (e) {}
  $('typeToggle').checked = gameType === 'timeline';
  $('typeToggle').addEventListener('change', e => {
    gameType = e.target.checked ? 'timeline' : 'quiz';
    try { localStorage.setItem(TYPE_KEY, gameType); } catch (err) {}
    updateModeView();
  });

  // 難易度トグル: 前回の設定を復元し、変更したら保存して表示を切り替える
  try { mode = localStorage.getItem(MODE_KEY) === 'hard' ? 'hard' : 'normal'; } catch (e) {}
  $('hardToggle').checked = mode === 'hard';
  $('hardToggle').addEventListener('change', e => {
    mode = e.target.checked ? 'hard' : 'normal';
    try { localStorage.setItem(MODE_KEY, mode); } catch (err) {}
    updateModeView();
  });

  $('tlDone').addEventListener('click', finishTimeline);
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  // タイトル画面に戻る(トグルと選択中モードのベスト表示はそのまま使える)
  $('menuBtn').addEventListener('click', () => show('title'));
  init();
})();
</script>
</body>
</html>
